# Copy this file to config/settings.yaml and edit as needed.
# config/settings.yaml is gitignored so credentials/local tweaks never get committed.

# Where the local SQLite trade log / settings / signal log live.
db_path: trading_bot.db

# "paper" (default): fully simulated fills, in-process. No credentials, never
#   touches any real account.
# "alpaca": Alpaca PAPER account — the real Alpaca API with simulated money.
#   Needs ALPACA_API_KEY_ID / ALPACA_API_SECRET_KEY in .env. Defaults to the
#   paper endpoint and refuses any other host unless
#   HF_BOT_I_UNDERSTAND_LIVE_TRADING=true. This is the recommended path.
# "robinhood": DORMANT. LIVE real money via an unofficial client. See the
#   README before touching it — Alpaca is the supported route.
broker: paper

# Where daily bars come from.
#   alpaca      — Alpaca primary, automatic yfinance fallback (default)
#   alpaca_only — Alpaca with no fallback; fail loudly if it's unavailable
#   yfinance    — Yahoo scraping only (original behaviour, unofficial)
data_provider: alpaca

# Only used by broker: paper (the simulated one). Live/paper Alpaca accounts
# report their own real equity.
starting_cash: 100000

watchlist:
  - symbol: NVDA
    strategy_key: momentum_90d
  - symbol: QQQ
    strategy_key: momentum_90d
  - symbol: VGT
    strategy_key: rsi_mean_reversion
  - symbol: NKE
    strategy_key: sma_crossover
  # Crypto works too — write the pair as BASE/USD (or a bare base like BTC).
  # Crypto is PDT-exempt and trades 24/7. Uncomment to include:
  # - symbol: BTC/USD
  #   strategy_key: momentum_90d
  # - symbol: ETH/USD
  #   strategy_key: momentum_90d

# Risk settings. Applied to the database on every run, so this file is the
# source of truth for them. Omit the block entirely to keep existing values.
# `kill_switch_active` is intentionally NOT settable here — it's runtime
# state; use `hf-bot kill-switch --on/--off`.
#
# risk:
#   risk_per_trade_pct: 1
#   max_position_pct: 20
#   max_open_positions: 5

# ---------------------------------------------------------------------------
# Example: small account sizing (~$200), e.g. an Alpaca paper account funded
# to match what you'd actually risk
# ---------------------------------------------------------------------------
# Set `broker: alpaca` above and run `hf-bot alpaca-check` first to confirm
# credentials. The PDT day-trade guard applies to accounts under $25k.
#
# These values are deliberately more aggressive than the engine defaults (1%
# risk/trade), because at a $200 balance a 1% risk budget sizes positions
# down to near-nothing. That is a real trade-off, not a free lunch: at 7%
# risk per trade, a handful of consecutive losers is a serious dent in the
# account. Do not use these numbers with money you can't afford to lose.
#
# risk:
#   risk_per_trade_pct: 7           # ~$14 risk budget per trade on $200
#   max_position_pct: 45            # ~$90/symbol cap — the real governor here
#   max_portfolio_exposure_pct: 90
#   max_open_positions: 2           # avoid fragmenting $200 into dust
#   atr_stop_multiple: 2.0
#   stop_loss_pct: 8
#   take_profit_r: 3
#   max_day_trades: 3               # PDT limit for accounts under $25k
